name: CI

env:
  IMAGE_NAME: octockup
  CONTEXT_PATH: src
  SOURCES_PATH: Octockup.Server

on:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/**"
    branches:
      - main
  push:
    paths:
      - "src/**"
      - ".github/workflows/**"
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    name: Build, Test, and Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/octockup.client/package-lock.json

      - name: Restore backend dependencies
        run: dotnet restore src/Octockup.sln

      - name: Install frontend dependencies
        working-directory: src/octockup.client
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: src/octockup.client
        run: npm audit --audit-level=high

      - name: Build backend
        run: dotnet build src/Octockup.sln -c Release --no-restore

      - name: Test backend
        run: dotnet test src/Octockup.Tests/Octockup.Tests.csproj -c Release --no-build

      - name: Lint frontend
        working-directory: src/octockup.client
        run: npm run lint

      - name: Test frontend
        working-directory: src/octockup.client
        run: npm run test

      - name: Build frontend
        working-directory: src/octockup.client
        run: npm run build

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      Version: ${{ steps.gitversion.outputs.SemVer }}
      CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: check repository
        uses: actions/checkout@v4
        with:
          lfs: "true"
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.11
        with:
          versionSpec: 5.x

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v3.1.11
        id: gitversion # step id used as reference for output values
      - name: Display GitVersion outputs
        run: |
          echo "Version: ${{ steps.gitversion.outputs.SemVer }}"
          echo "CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}"

      - name: login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Build and push docker image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT_PATH }}
          push: true
          tags: |
            bvdcode/${{ env.IMAGE_NAME }}:latest
            bvdcode/${{ env.IMAGE_NAME }}:${{ steps.gitversion.outputs.semVer }}
          file: ${{ env.CONTEXT_PATH }}/${{ env.SOURCES_PATH }}/Dockerfile

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docker image to GitHub Container Registry
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT_PATH }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.gitversion.outputs.semVer }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          file: ${{ env.CONTEXT_PATH }}/${{ env.SOURCES_PATH }}/Dockerfile

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' # only run job if on the master branch
    steps:
      - name: Create Release
        if: needs.build.outputs.CommitsSinceVersionSource > 0
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.build.outputs.Version }}
          name: Release ${{ needs.build.outputs.Version }}
          artifacts: "nupkg/*"
          token: ${{ secrets.GITHUB_TOKEN }}
